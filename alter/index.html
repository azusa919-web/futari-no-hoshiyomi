<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe8">
  <title>アルター</title>
  <style>
    :root { color: #2f3937; background: #f3efe8; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #f3efe8; }
    main { width: min(100%, 600px); margin: 0 auto; padding: max(42px, env(safe-area-inset-top)) 18px max(54px, env(safe-area-inset-bottom)); }
    header { padding: 14px 10px 42px; }
    h1 { margin: 0 0 14px; font-size: clamp(31px, 9vw, 46px); font-weight: 500; letter-spacing: .09em; }
    .lead { margin: 0; font-size: 15px; line-height: 2; color: #5c6561; }
    .note { margin: 30px 0 38px; padding: 17px 18px; border: 1px solid #c9c2b4; border-radius: 18px; color: #53605b; font-size: 14px; line-height: 1.85; }
    .cards { display: grid; gap: 32px; }
    figure { margin: 0; }
    img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 24px; box-shadow: 0 10px 28px rgba(63, 51, 32, .13); }
    figcaption { padding: 15px 8px 0; }
    h2 { margin: 0 0 6px; font-size: 21px; font-weight: 500; letter-spacing: .04em; }
    figcaption p { margin: 0; color: #65706a; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; font-size: 14px; line-height: 1.7; }
    footer { padding: 54px 8px 0; color: #8a908a; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>アルター</h1>
      <p class="lead">いま、この瞬間の感覚に戻るための場所。</p>
      <p class="note">何かを叶えるためではなく、ただ見て、呼吸して、戻ってくる。<br>近いものを一枚だけ開けばいい。</p>
    </header>
    <section class="cards" aria-label="五感に戻る画像">
      <figure>
        <img src="assets/shore.png" alt="足元にやさしい波が触れ、砂が広がる海辺">
        <figcaption><h2>波と砂</h2><p>足に水が触れ、砂がほどける。</p></figcaption>
      </figure>
      <figure>
        <img src="assets/dew.png" alt="朝露の粒が葉と淡い花びらに乗っている">
        <figcaption><h2>朝露</h2><p>ひんやり濡れた、葉っぱと花びら。</p></figcaption>
      </figure>
      <figure>
        <img src="assets/softness.png" alt="やわらかなクッションと包み込む毛布">
        <figcaption><h2>やわらかさ</h2><p>ふんわり、包み込まれる。</p></figcaption>
      </figure>
    </section>
    <footer>大将のための、感覚へ戻る鍵。</footer>
  </main>
</body>
</html>
